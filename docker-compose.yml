services:
  app:
    container_name: ayendri-frontend
    image: ghcr.io/amptechnology-dev/ayendri-new-frontend:latest
    env_file:
      - .env
    expose:
      - "3061"
    networks:
      - shared-nginx-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared-nginx-net:
    external: true
    name: amp_portal_backend_app-network